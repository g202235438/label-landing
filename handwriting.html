 document.querySelector('.sticky').innerHTML=`<span>오지렌 WP9529 핑크</span>${buy('sticky')}`;
 document.getElementById('affiliate-note').textContent=affiliate?'이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.':'상품 가격과 옵션은 쿠팡 상품 페이지에서 확인할 수 있습니다.';
 if(test){const b=document.createElement('div');b.className='test-banner';b.textContent='점검 모드: 메타 이벤트를 전송하지 않습니다.';document.body.prepend(b);}
 let storageOK=true;
 function once(key){try{if(sessionStorage.getItem((test?'test:':'live:')+key))return false;sessionStorage.setItem((test?'test:':'live:')+key,'1');return true;}catch{storageOK=false;return false;}}
 const params=new URLSearchParams(location.search), paid=/^(meta|facebook|instagram)$/i.test(params.get('utm_source')||'');
 const enabled=!test&&/^\d{5,}$/.test(config.metaPixelId);
 if(enabled){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init',config.metaPixelId);fbq('track','PageView');}
 window.labelDebug={variant,test,pixelConfigured:enabled,paid,events:[],destination};
 const emit=(event,extra={})=>{const values={variant,traffic_source:paid?'meta':'other',...extra};window.labelDebug.events.push({event,values});window.dispatchEvent(new CustomEvent('label:event',{detail:{event,values}}));if(enabled&&paid)window.fbq('trackCustom',event,values);};
 if(once('label:visit:'+variant))emit('LandingSession');
 document.querySelectorAll('[data-buy]').forEach(a=>{a.href=destination||'#';a.target='_blank';a.rel=affiliate?'sponsored noopener':'noopener';a.addEventListener('click',event=>{if(!destination){event.preventDefault();return;}if(once('label:click:'+variant))emit('CoupangOutboundClick',{placement:a.dataset.buy});});});
 window.labelDebug.storageOK=storageOK;
})();
